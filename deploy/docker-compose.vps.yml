# =============================================================================
# Оверрайд стека для VPS в РЕЖИМЕ СТЕНДА ПО IP (домена ещё нет, Caddy не поднят).
# =============================================================================
# На сервере копируется в Uni_BD/docker-compose.override.yml.
#   витрина       → http://<IP>        (storefront, 80→3000)
#   админка + API → http://<IP>:8080   (app, 8080→3000)
#   медиа         → http://<IP>:9100/admik-media (MinIO напрямую)
#
# ⚠ Порт 9000 занимать НЕЛЬЗЯ: базовый compose уже держит 127.0.0.1:9000, а
#   списки ports СКЛАДЫВАЮТСЯ — конфликт уронил бы весь `up`.
# ⚠ Стек поднимать явным списком сервисов: docker compose up -d app storefront
#   (иначе compose потянет caddy/cron/backup, которые в этом режиме не нужны).
#
# При переезде на домен: удалить этот файл, вернуть Caddy и HTTPS по docs/09.
# =============================================================================

services:
  app:
    ports:
      - "8080:3000"

  storefront:
    build:
      context: ../storefront
    ports:
      - "80:3000"
    # Витрина статическая: без API она отрисуется (шапка/подвал/тексты),
    # поэтому ждать health приложения на старте не нужно.
    depends_on: !reset []
    # Базовый healthcheck платформы проверяет витрину через `node -e fetch(...)`,
    # но здесь образ nginx — Node в нём нет, и контейнер вечно висел бы unhealthy.
    # Проверяем тем, что есть в alpine-образе nginx. Адрес — 127.0.0.1, а НЕ localhost:
    # busybox-wget резолвит localhost в ::1, а nginx слушает только IPv4 → connection refused
    # при живой витрине.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    ports:
      - "9100:9000"
