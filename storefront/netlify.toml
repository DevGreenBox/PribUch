[build]
  command = "bash ./build.sh"
  publish = "dist"

  # Сайт — чистая статика. Next.js в package.json родительского монорепо
  # заставляет Netlify подключать @netlify/plugin-nextjs; здесь он не нужен.
  [build.environment]
    NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
