# Раздача статики витрины. Порт 3000 — так же, как у Next.js-витрин платформы,
# чтобы docker-compose и healthcheck работали без правок.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Многостраничный сайт: путь = файл. НИКАКОГО try_files → /index.html,
  # иначе любой адрес схлопнулся бы в главную (типичная ошибка раздачи макетов).
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;

  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "strict-origin-when-cross-origin";

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
